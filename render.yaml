services:
  - type: web
    name: travelie-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
